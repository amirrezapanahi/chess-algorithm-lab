name: Bug report
description: Report a reproducible problem in the editor, runtime, visualizer, or exercises.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the exercise and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal student code and input. Do not include private data.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Additional context
      description: Add console errors, screenshots, or a deployed URL.
