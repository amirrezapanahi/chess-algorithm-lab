name: Feature or exercise request
description: Suggest an educational improvement or a new algorithm exercise.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: learning-goal
    attributes:
      label: Learning goal
      description: What concept should a student understand after using this?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Proposed experience
      description: Describe inputs, outputs, validation, and useful visualization events.
    validations:
      required: true
