name: Publish GitHub Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki source
        uses: actions/checkout@v4

      - name: Clone GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" .wiki-publish

      - name: Synchronize pages
        run: |
          find .wiki-publish -maxdepth 1 -type f -name '*.md' -delete
          cp wiki/*.md .wiki-publish/

      - name: Commit and push
        working-directory: .wiki-publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "docs: synchronize multilingual wiki"
            git push
          fi
